spring:
  application:
    name: expense-tracker

  # H2 Configuration (for local development without PostgreSQL)
  datasource:
    url: jdbc:h2:mem:expense_tracker;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  
  # Uncomment below for PostgreSQL configuration
  # Read DB_URL, DB_USERNAME, DB_PASSWORD from environment variables
  # datasource:
  #   url: ${DB_URL:jdbc:postgresql://localhost:5432/expense_tracker}
  #   username: ${DB_USERNAME:postgres}
  #   password: ${DB_PASSWORD:password}

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # For PostgreSQL, use: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # H2 Console (for debugging, remove for production)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: true

# Logging
logging:
  level:
    root: INFO
    com.example.expensetracker: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# Server
server:
  port: 8080
  servlet:
    context-path: /
  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-cache: true
          no-store: true

# Swagger/OpenAPI
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    displayOperationId: true
    filter: true
  api-docs:
    path: /v3/api-docs
    title: Expense Tracker API
    version: OPENAPI_3_0
    description: Backend-first personal expense tracker
